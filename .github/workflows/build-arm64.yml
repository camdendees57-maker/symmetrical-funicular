name: build-arm64
on:
  workflow_dispatch:
    inputs:
      unity_version:
        description: "Game Unity editor version"
        required: true
        default: "2021.3.33f1"
  push:
    branches: [ main ]

jobs:
  android-so:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
      - name: vendor imgui if missing
        run: |
          if [ ! -f third_party/imgui/imgui.cpp ]; then
            git clone --depth 1 https://github.com/ocornut/imgui.git /tmp/imgui
            mkdir -p third_party/imgui/backends
            cp /tmp/imgui/imgui*.cpp /tmp/imgui/imgui*.h /tmp/imgui/imconfig.h third_party/imgui/ || true
            cp /tmp/imgui/backends/imgui_impl_opengl3.* third_party/imgui/backends/
          fi
      - name: cmake
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          UV="${{ github.event.inputs.unity_version }}"
          UV=${UV:-2021.3.33f1}
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DUNITY_VERSION=$UV
          cmake --build build -j$(nproc)
          find build -name "libimgui.so" -ls
      - uses: actions/upload-artifact@v4
        with:
          name: libimgui-arm64
          path: |
            build/**/libimgui.so
            build/lib/arm64-v8a/**
