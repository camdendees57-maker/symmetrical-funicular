name: build-arm64
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  android-so:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pin imgui 1.92.8
        run: |
          rm -rf third_party/imgui
          git clone --depth 1 --branch v1.92.8 https://github.com/ocornut/imgui.git third_party/imgui
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
      - name: cmake
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DUNITY_VERSION=6000.0.66f2 \
            -DIMGUI_DIR=${GITHUB_WORKSPACE}/third_party/imgui
          cmake --build build -j$(nproc)
          find build -name "libholdmenu.so" -ls
      - uses: actions/upload-artifact@v4
        with:
          name: libholdmenu-arm64-unity6
          path: build/**/libholdmenu.so
