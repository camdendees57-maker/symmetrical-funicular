name: Build arm64 ImGui menu

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Dear ImGui and arm64 hook
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.91.8 https://github.com/ocornut/imgui.git third_party/imgui
          git clone --depth 1 https://github.com/Rprop/And64InlineHook.git third_party/And64InlineHook

      - name: Install NDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;$ANDROID_NDK_VERSION"
          test -f "$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION/build/cmake/android.toolchain.cmake"

      - name: Configure and build
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Check ABI
        run: |
          file build/libaxiommenu.so
          readelf -h build/libaxiommenu.so | grep -E "Class|Machine"
          mkdir -p out
          cp build/libaxiommenu.so out/libaxiommenu.so

      - uses: actions/upload-artifact@v4
        with:
          name: libaxiommenu-arm64
          path: out/libaxiommenu.so
