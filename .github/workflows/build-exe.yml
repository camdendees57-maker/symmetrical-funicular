name: build-exe
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "tools/**"
      - ".github/workflows/build-exe.yml"
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        shell: cmd
        run: |
          g++ -O2 -static -std=c++17 -mwindows -o so_string_edit.exe tools\so_string_edit.cpp -lcomdlg32 -lcomctl32 -luser32 -lgdi32
          if errorlevel 1 (
            call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
            cl /O2 /EHsc /DUNICODE /D_UNICODE tools\so_string_edit.cpp /Fe:so_string_edit.exe /link /SUBSYSTEM:WINDOWS comdlg32.lib comctl32.lib user32.lib gdi32.lib
          )
          dir so_string_edit.exe
      - uses: actions/upload-artifact@v4
        with:
          name: so_string_edit-gui-win64
          path: so_string_edit.exe
